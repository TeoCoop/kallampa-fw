[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    tzapu/WiFiManager@^2.0.17
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14
board_build.embed_txtfiles = web/index.html
; Dos lugares de programa de 1,875 MB para poder actualizar por WiFi (OTA)
board_build.partitions = min_spiffs.csv
extra_scripts = post:scripts/version.py

; Subida por WiFi: ./upload-ota.sh <equipo> (pasa --upload-port)
[env:ota]
extends = env:esp32dev
upload_protocol = espota
